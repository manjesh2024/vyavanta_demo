name: Deploy VYAVANTA demo to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: ${{ github.event.repository.has_pages == true }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
  pages-disabled:
    if: ${{ github.event.repository.has_pages != true }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain required repository setting
        run: |
          echo "::notice title=GitHub Pages is disabled::Enable Pages in Settings > Pages and choose GitHub Actions as the build/deployment source to publish this static demo."
